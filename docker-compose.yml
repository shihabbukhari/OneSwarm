services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oneswarm
      POSTGRES_PASSWORD: oneswarm
      POSTGRES_DB: oneswarm
    ports:
      - "5432:5432"
    volumes:
      - oneswarm-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneswarm"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  oneswarm-pg:
